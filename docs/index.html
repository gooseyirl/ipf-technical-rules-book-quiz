<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPF Technical Rules Quiz</title>
    <meta name="description" content="Test your knowledge of the IPF Technical Rules Book. Multiple choice questions for powerlifters, coaches and referees.">
    <style>
        :root {
            --primary:        #1565C0;
            --primary-dark:   #0D47A1;
            --primary-light:  #E3F2FD;
            --correct:        #2E7D32;
            --correct-light:  #E8F5E9;
            --incorrect:      #C62828;
            --incorrect-light:#FFEBEE;
            --surface:        #FFFFFF;
            --bg:             #F0F4F9;
            --text:           #1A1A2E;
            --text-muted:     #6B7280;
            --border:         #E2E8F0;
            --radius:         12px;
            --shadow:         0 1px 4px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.05);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* ── Layout ─────────────────────────────────────────── */
        .wrap {
            max-width: 620px;
            margin: 0 auto;
            padding: 16px 16px 40px;
        }

        .screen { display: none; flex-direction: column; gap: 16px; }
        .screen.active { display: flex; }

        /* ── Card ───────────────────────────────────────────── */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        /* ── Home ───────────────────────────────────────────── */
        .home-header {
            text-align: center;
            padding: 20px 0 4px;
        }
        .home-header h1 {
            font-size: clamp(1.4rem, 5vw, 1.9rem);
            font-weight: 800;
            color: var(--primary);
            line-height: 1.2;
        }
        .home-header p {
            color: var(--text-muted);
            margin-top: 6px;
            font-size: 0.95rem;
        }

        .section-label {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 10px;
        }

        .qty-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .qty-btn {
            border: 2px solid var(--border);
            background: var(--surface);
            border-radius: 8px;
            padding: 12px 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text);
            transition: border-color 0.15s, background 0.15s, color 0.15s;
        }
        .qty-btn:hover { border-color: var(--primary); }
        .qty-btn.active {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
        }

        .home-info {
            font-size: 0.83rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;
        }
        .home-info strong { color: var(--text); }

        /* ── Buttons ────────────────────────────────────────── */
        .btn {
            display: block;
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s, opacity 0.15s;
            text-decoration: none;
        }
        .btn + .btn { margin-top: 10px; }

        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-secondary { background: var(--primary-light); color: var(--primary); }
        .btn-secondary:hover { background: #BBDEFB; }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1.5px solid var(--border);
        }
        .btn-ghost:hover { background: var(--bg); }

        /* ── Progress bar ───────────────────────────────────── */
        .progress-wrap {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 3px;
            transition: width 0.35s ease;
        }

        /* ── Quiz ───────────────────────────────────────────── */
        .q-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .q-label {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
        }
        .q-counter {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .q-text {
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.55;
            margin-bottom: 20px;
        }

        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }

        .opt {
            width: 100%;
            text-align: left;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            font-size: 0.95rem;
            line-height: 1.4;
            cursor: pointer;
            color: var(--text);
            transition: border-color 0.15s, background 0.15s;
        }
        .opt:hover:not(:disabled) {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .opt.correct {
            border-color: var(--correct);
            background: var(--correct-light);
            color: var(--correct);
            font-weight: 600;
        }
        .opt.incorrect {
            border-color: var(--incorrect);
            background: var(--incorrect-light);
            color: var(--incorrect);
        }
        .opt:disabled { cursor: default; }

        /* ── Feedback ───────────────────────────────────────── */
        .feedback {
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 16px;
            display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct {
            background: var(--correct-light);
            border-left: 4px solid var(--correct);
        }
        .feedback.incorrect {
            background: var(--incorrect-light);
            border-left: 4px solid var(--incorrect);
        }
        .feedback-title {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 5px;
        }
        .feedback.correct .feedback-title { color: var(--correct); }
        .feedback.incorrect .feedback-title { color: var(--incorrect); }
        .feedback-body { font-size: 0.88rem; color: var(--text); }
        .feedback-body p + p { margin-top: 4px; }
        .feedback-rule {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 6px;
        }
        .feedback-hint {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 10px;
            text-align: right;
            opacity: 0.7;
        }

        /* ── Results ────────────────────────────────────────── */
        .results-head { text-align: center; padding: 8px 0 0; }
        .results-head h2 { font-size: 1.3rem; font-weight: 800; }

        .score-ring {
            width: 118px;
            height: 118px;
            border-radius: 50%;
            border: 6px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px auto 10px;
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
        }
        .score-ring.pass { border-color: var(--correct); color: var(--correct); }
        .score-ring.fail { border-color: var(--incorrect); color: var(--incorrect); }

        .badge {
            display: inline-block;
            padding: 3px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 18px;
        }
        .badge.pass { background: var(--correct-light); color: var(--correct); }
        .badge.fail { background: var(--incorrect-light); color: var(--incorrect); }

        .score-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .score-cell {
            border-radius: 10px;
            padding: 16px 12px;
            text-align: center;
        }
        .score-cell .num { font-size: 1.9rem; font-weight: 800; line-height: 1; }
        .score-cell .lbl { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }
        .score-cell.c { background: var(--correct-light); }
        .score-cell.c .num { color: var(--correct); }
        .score-cell.i { background: var(--incorrect-light); }
        .score-cell.i .num { color: var(--incorrect); }

        /* ── Review ─────────────────────────────────────────── */
        .review-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 0;
            flex-shrink: 0;
        }
        .review-top h2 { font-size: 1rem; font-weight: 700; }

        .review-list { display: flex; flex-direction: column; gap: 12px; }

        .rev-item {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--border);
        }
        .rev-item.correct { border-left-color: var(--correct); }
        .rev-item.incorrect { border-left-color: var(--incorrect); }

        .rev-q-num {
            font-size: 0.73rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        .rev-q-text {
            font-size: 0.93rem;
            font-weight: 500;
            margin-bottom: 10px;
        }
        .rev-answer {
            display: inline-block;
            font-size: 0.84rem;
            padding: 5px 10px;
            border-radius: 6px;
            margin-bottom: 4px;
        }
        .rev-answer.user-correct  { background: var(--correct-light);   color: var(--correct);   font-weight: 600; }
        .rev-answer.user-wrong    { background: var(--incorrect-light); color: var(--incorrect); text-decoration: line-through; }
        .rev-answer.right-answer  { background: var(--correct-light);   color: var(--correct);   font-weight: 600; }

        .rev-explanation {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }
        .rev-rule {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ── Ad slots ───────────────────────────────────────── */
        /* Replace the contents of these divs with your ad code */
        .ad-slot { width: 100%; min-height: 0; }
        .ad-slot:not(:empty) {
            min-height: 60px;
            background: #f8f8f8;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Utility ────────────────────────────────────────── */
        .text-center { text-align: center; }
    </style>
</head>
<body>
<div class="wrap">

    <!-- ════════════════════════════════════════════════════════
         HOME SCREEN
         ════════════════════════════════════════════════════════ -->
    <div id="home" class="screen active">

        <!-- AD SLOT: top banner (e.g. Google AdSense responsive unit) -->
        <div class="ad-slot" id="ad-home-top"></div>

        <div class="home-header">
            <h1>IPF Technical Rules Quiz</h1>
            <p>Test your knowledge of the rulebook</p>
        </div>

        <div class="card">
            <div class="section-label">Number of questions</div>
            <div class="qty-grid">
                <button class="qty-btn" data-qty="5">5</button>
                <button class="qty-btn active" data-qty="10">10</button>
                <button class="qty-btn" data-qty="20">20</button>
                <button class="qty-btn" data-qty="all">All</button>
            </div>
            <button class="btn btn-primary" id="start-btn">Start Quiz</button>
        </div>

        <div class="card home-info">
            Questions are drawn from the <strong>IPF Technical Rules Book</strong>.<br>
            A score of <strong>70%</strong> or above is considered a pass.
        </div>

        <!-- AD SLOT: below info -->
        <div class="ad-slot" id="ad-home-bottom"></div>

    </div>

    <!-- ════════════════════════════════════════════════════════
         QUIZ SCREEN
         ════════════════════════════════════════════════════════ -->
    <div id="quiz" class="screen">

        <div class="progress-wrap">
            <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>

        <div class="card">
            <div class="q-meta">
                <span class="q-label">Question <span id="q-num">1</span></span>
                <span class="q-counter"><span id="q-cur">1</span> / <span id="q-tot">10</span></span>
            </div>
            <p class="q-text" id="q-text"></p>
            <div class="options" id="options"></div>
            <div class="feedback" id="feedback">
                <div class="feedback-title" id="fb-title"></div>
                <div class="feedback-body">
                    <p id="fb-body"></p>
                    <p class="feedback-rule" id="fb-rule"></p>
                </div>
                <p class="feedback-hint" id="fb-hint"></p>
            </div>
        </div>

    </div>

    <!-- ════════════════════════════════════════════════════════
         RESULTS SCREEN
         ════════════════════════════════════════════════════════ -->
    <div id="results" class="screen">

        <!-- AD SLOT: results page -->
        <div class="ad-slot" id="ad-results"></div>

        <div class="results-head card text-center">
            <h2>Quiz Complete</h2>
            <div class="score-ring" id="score-ring"><span id="score-pct">—</span></div>
            <div class="badge" id="badge">Pass</div>
            <div class="score-grid">
                <div class="score-cell c">
                    <div class="num" id="correct-n">0</div>
                    <div class="lbl">Correct</div>
                </div>
                <div class="score-cell i">
                    <div class="num" id="incorrect-n">0</div>
                    <div class="lbl">Incorrect</div>
                </div>
            </div>
            <button class="btn btn-secondary" id="review-btn">Review Answers</button>
            <button class="btn btn-primary" id="retake-btn" style="margin-top:10px">Retake Quiz</button>
            <button class="btn btn-ghost"   id="home-btn"   style="margin-top:10px">Home</button>
        </div>

    </div>

    <!-- ════════════════════════════════════════════════════════
         REVIEW SCREEN
         ════════════════════════════════════════════════════════ -->
    <div id="review" class="screen">

        <div class="review-top card" style="padding:14px 20px;">
            <button class="back-btn" id="back-btn">← Results</button>
            <h2>Answer Review</h2>
        </div>

        <div class="review-list" id="review-list"></div>

        <!-- AD SLOT: bottom of review -->
        <div class="ad-slot" id="ad-review"></div>

    </div>

</div><!-- /wrap -->

<script>
// ================================================================
// Data & state
// ================================================================
let bank        = [];   // all validated questions
let quiz        = [];   // questions for this session
let idx         = 0;    // current question index
let answered    = [];   // { question, userIdx, isCorrect }
let picked      = null; // selected option index (null = none yet)
let qty         = 10;   // chosen quantity ('all' or number)

// ================================================================
// Boot
// ================================================================
(async function init() {
    try {
        const r = await fetch('questions.json');
        const d = await r.json();
        bank = d.questions.filter(q => q.status === 'validated');
    } catch (e) {
        bank = [];
        console.error('Could not load questions:', e);
    }
    // Update "All" button label with actual count
    const allBtn = document.querySelector('.qty-btn[data-qty="all"]');
    if (allBtn && bank.length) allBtn.textContent = 'All\u00A0(' + bank.length + ')';

    bindEvents();
})();

// ================================================================
// Event wiring
// ================================================================
function bindEvents() {
    document.querySelectorAll('.qty-btn').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('.qty-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        qty = b.dataset.qty === 'all' ? 'all' : parseInt(b.dataset.qty, 10);
    }));

    get('start-btn').addEventListener('click', startQuiz);
    get('review-btn').addEventListener('click', showReview);
    get('retake-btn').addEventListener('click', startQuiz);
    get('home-btn').addEventListener('click', () => show('home'));
    get('back-btn').addEventListener('click', () => show('results'));

    document.addEventListener('keydown', e => {
        const n = parseInt(e.key, 10);
        if (n >= 1 && n <= 4 && get('quiz').classList.contains('active')) {
            const opts = document.querySelectorAll('.opt:not(:disabled)');
            if (opts[n - 1]) opts[n - 1].click();
        }
    });
}

// ================================================================
// Quiz
// ================================================================
function startQuiz() {
    if (!bank.length) { alert('Questions failed to load. Please refresh the page.'); return; }
    const shuffled = [...bank].sort(() => Math.random() - 0.5);
    quiz    = qty === 'all' ? shuffled : shuffled.slice(0, Math.min(qty, shuffled.length));
    idx     = 0;
    answered = [];
    renderQuestion();
    show('quiz');
}

function renderQuestion() {
    const q = quiz[idx];
    picked  = null;

    // Progress
    get('progress-fill').style.width = (idx / quiz.length * 100) + '%';
    get('q-num').textContent = idx + 1;
    get('q-cur').textContent = idx + 1;
    get('q-tot').textContent = quiz.length;

    // Question
    get('q-text').textContent = q.question;

    // Options
    const container = get('options');
    container.innerHTML = '';
    q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt';
        btn.textContent = opt;
        btn.addEventListener('click', () => pick(i));
        container.appendChild(btn);
    });

    // Reset
    const fb = get('feedback');
    fb.className = 'feedback';
}

function pick(i) {
    if (picked !== null) return;
    picked = i;

    const q  = quiz[idx];
    const ok = i === q.correctAnswerIndex;

    // Style options
    document.querySelectorAll('.opt').forEach((b, j) => {
        b.disabled = true;
        if (j === q.correctAnswerIndex) b.classList.add('correct');
        else if (j === i)               b.classList.add('incorrect');
    });

    // Feedback
    const fb = get('feedback');
    fb.className = 'feedback show ' + (ok ? 'correct' : 'incorrect');
    get('fb-title').textContent = ok ? '✓  Correct' : '✗  Incorrect';

    let body = '';
    if (!ok) body = 'The correct answer is: ' + q.options[q.correctAnswerIndex] + '.';
    if (q.explanation) body += (body ? '  ' : '') + q.explanation;
    get('fb-body').textContent = body;

    get('fb-rule').textContent = ruleRefText(q.ruleReference);

    answered.push({ question: q, userIdx: i, isCorrect: ok });

    const isLast = idx + 1 >= quiz.length;
    get('fb-hint').textContent = isLast ? 'Tap anywhere to see results…' : 'Tap anywhere to continue…';

    const goNext = () => {
        document.removeEventListener('click', goNext);
        advance();
    };
    // Small delay so the tap that selected the answer doesn't immediately advance
    setTimeout(() => document.addEventListener('click', goNext), 400);
}

function advance() {
    idx++;
    if (idx >= quiz.length) showResults();
    else renderQuestion();
}

// ================================================================
// Results
// ================================================================
function showResults() {
    get('progress-fill').style.width = '100%';

    const total   = answered.length;
    const correct = answered.filter(a => a.isCorrect).length;
    const wrong   = total - correct;
    const pct     = Math.round(correct / total * 100);
    const pass    = pct >= 70;

    get('score-pct').textContent   = pct + '%';
    get('correct-n').textContent   = correct;
    get('incorrect-n').textContent = wrong;

    const ring  = get('score-ring');
    ring.className = 'score-ring ' + (pass ? 'pass' : 'fail');

    const badge = get('badge');
    badge.textContent = pass ? 'Pass' : 'Fail';
    badge.className   = 'badge '    + (pass ? 'pass' : 'fail');

    show('results');
}

// ================================================================
// Review
// ================================================================
function showReview() {
    const list = get('review-list');
    list.innerHTML = '';

    answered.forEach(({ question: q, userIdx, isCorrect }, n) => {
        const el = document.createElement('div');
        el.className = 'rev-item ' + (isCorrect ? 'correct' : 'incorrect');

        const userClass = isCorrect ? 'user-correct' : 'user-wrong';
        const correctRow = !isCorrect
            ? `<div class="rev-answer right-answer">✓ ${esc(q.options[q.correctAnswerIndex])}</div>`
            : '';

        el.innerHTML =
            `<div class="rev-q-num">Question ${n + 1}</div>` +
            `<div class="rev-q-text">${esc(q.question)}</div>` +
            `<div class="rev-answer ${userClass}">${isCorrect ? '✓' : '✗'} ${esc(q.options[userIdx])}</div>` +
            correctRow +
            (q.explanation
                ? `<div class="rev-explanation">${esc(q.explanation)}</div>`
                : '') +
            (q.ruleReference
                ? `<div class="rev-rule">${esc(ruleRefText(q.ruleReference))}</div>`
                : '');

        list.appendChild(el);
    });

    show('review');
}

// ================================================================
// Helpers
// ================================================================
function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    get(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function get(id) { return document.getElementById(id); }

function esc(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function ruleRefText(ref) {
    if (!ref) return '';
    let s = 'Rule ' + ref.ruleNumber + ' — ' + ref.section;
    if (ref.subsection) s += ' › ' + ref.subsection;
    if (ref.pageNumber)  s += ' (page ' + ref.pageNumber + ')';
    return s;
}
</script>
</body>
</html>
